syntax = "proto3";

package auth.v1;

option go_package = "github.com/bigelle/auth/gen/go/auth/v1;authv1";

// TODO: add validation using validate.proto
message AuthenticateAccountRequest {
  oneof credential {
    string username = 1;
    string email = 2;
  }
  string password = 3;
  string challenge = 4;
}

message AuthenticateAccountResponse {
  optional string auth_code = 1;
}

message ExchangeAuthCodeRequest {
  string code = 1;
  string verifier = 2;
}

message ExchangeAuthCodeResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
}

message RefreshAccessTokenRequest {
  string refresh_token = 1;
}

message RefreshAccessTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
}
