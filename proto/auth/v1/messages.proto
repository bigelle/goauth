syntax = "proto3";

package auth.v1;

option go_package = "github.com/bigelle/auth/gen/go/auth/v1;authv1";

// TODO: add validation using validate.proto
message LoginRequest {
  oneof credential {
    string username = 1;
    string email = 2;
  }
  string password = 3;
  string challenge = 4;
}

message LoginResponse {
  optional string auth_code = 1;
}
